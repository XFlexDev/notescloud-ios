name: Build iOS Notes App (Unsigned IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_27.app" ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Build NotesApp (Unsigned Release)
        run: |
          xcodebuild clean build \
            -project NotesApp/NotesApp.xcodeproj \
            -scheme NotesApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          APP_DIR=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_DIR"
          cp -R "$APP_DIR" build/Payload/
          cd build
          zip -r NotesApp-unsigned.ipa Payload/
          ls -lh NotesApp-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotesApp-unsigned-ipa
          path: build/NotesApp-unsigned.ipa
          retention-days: 30

      - name: Upload to Backblaze B2 & CDN
        env:
          KEY_ID: "003ffcd38a3a514000000000f"
          APP_KEY: "K0038jWSTA9PlX0GyZ9KRcsRBLp2ycs"
          BUCKET_ID: "afcfac5d33886a03aa150114"
          BUCKET_NAME: "kreatix-agy"
        run: |
          AUTH=$(curl -s -u "$KEY_ID:$APP_KEY" https://api.backblazeb2.com/b2api/v3/b2_authorize_account)
          TOKEN=$(echo "$AUTH" | jq -r .authorizationToken)
          API_URL=$(echo "$AUTH" | jq -r .apiInfo.storageApi.apiUrl)

          UPLOAD_INFO=$(curl -s -H "Authorization: $TOKEN" -d "{\"bucketId\":\"$BUCKET_ID\"}" "$API_URL/b2api/v3/b2_get_upload_url")
          UPLOAD_URL=$(echo "$UPLOAD_INFO" | jq -r .uploadUrl)
          UPLOAD_TOKEN=$(echo "$UPLOAD_INFO" | jq -r .authorizationToken)

          FILE_PATH="build/NotesApp-unsigned.ipa"
          REMOTE_NAME="NotesApp-unsigned.ipa"
          SHA1=$(shasum -a 1 "$FILE_PATH" | awk '{print $1}')
          FILE_SIZE=$(stat -f%z "$FILE_PATH")

          curl -s \
            -H "Authorization: $UPLOAD_TOKEN" \
            -H "X-Bz-File-Name: $REMOTE_NAME" \
            -H "Content-Type: application/octet-stream" \
            -H "Content-Length: $FILE_SIZE" \
            -H "X-Bz-Content-Sha1: $SHA1" \
            --data-binary @"$FILE_PATH" \
            "$UPLOAD_URL"

          echo "IPA uploaded to B2!"
          echo "Download URL: https://cdn.kreatix.dev/file/$BUCKET_NAME/$REMOTE_NAME"
